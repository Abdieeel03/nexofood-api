user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Formato de logs incluyendo IP real de Cloudflare
    log_format main_cf '$remote_addr - $http_cf_connecting_ip [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for" '
                       'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main_cf;

    # Optimizaciones de E/S del kernel
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Mapeo de IP real: prioriza CF-Connecting-IP, si no existe toma remote_addr
    map $http_cf_connecting_ip $client_real_ip {
        default $http_cf_connecting_ip;
        ""      $remote_addr;
    }

    # Zonas de Rate Limiting en memoria RAM
    # 30 solicitudes/segundo por IP, con buffer de 10 MB para almacenar unas 160.000 IPs únicas
    limit_req_zone $client_real_ip zone=api_rate_limit:10m rate=30r/s;
    limit_conn_zone $client_real_ip zone=api_conn_limit:10m;

    # Compresión Gzip para respuestas JSON y texto
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/css
        text/plain
        text/javascript;

    # Upstream hacia el contenedor de Spring Boot
    upstream spring-backend {
        server api:8080;
        keepalive 64; # Mantiene sockets abiertos con Tomcat para alta velocidad
    }

    server {
        listen 80;
        server_name localhost;

        # Límite máximo para subidas de archivos (logos, banners, imágenes)
        client_max_body_size 10M;
        client_body_buffer_size 128k;

        # Encabezados comunes para proxy inverso y túneles (heredados por todas las rutas)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # Buffering de peticiones y respuestas para liberar a la JVM en microsegundos
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;

        # Timeouts de conexión hacia Spring Boot
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Aplicar Rate Limiting a toda la API
        # Permite ráfagas de hasta 50 peticiones sin retraso, luego responde HTTP 429
        limit_req zone=api_rate_limit burst=50 nodelay;
        limit_conn api_conn_limit 30;
        limit_req_status 429;
        limit_conn_status 429;

        # Endpoint de salud (Actuator): exento de rate limit para cloudflared y monitores
        location = /actuator/health {
            proxy_pass http://spring-backend/actuator/health;
            access_log off;
            limit_req zone=api_rate_limit burst=100 nodelay;
        }

        # Regla principal para enrutar tráfico hacia Spring Boot
        location / {
            proxy_pass http://spring-backend;
        }
    }
}
