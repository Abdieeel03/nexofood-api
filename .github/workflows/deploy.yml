name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.prep.outputs.image_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare lowercase image name
        id: prep
        run: |
          IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image_name=${IMAGE_REPO}:latest" >> "$GITHUB_OUTPUT"
          echo "image_sha=${IMAGE_REPO}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.prep.outputs.image_name }}
            ${{ steps.prep.outputs.image_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          sudo install -m 755 /tmp/cloudflared /usr/local/bin/cloudflared

      - name: Deploy via SSH over Cloudflare Tunnel
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          API_IMAGE: ${{ needs.build-and-push.outputs.image_name }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          PROXY_CMD="/usr/local/bin/cloudflared access ssh --hostname %h"
          if [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ]; then
            PROXY_CMD="$PROXY_CMD --service-token-id $CF_ACCESS_CLIENT_ID --service-token-secret $CF_ACCESS_CLIENT_SECRET"
          fi

          cat > ~/.ssh/config <<EOF
          Host $SERVER_HOST
            User $SERVER_USER
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking no
            BatchMode yes
            ConnectTimeout 30
            ProxyCommand $PROXY_CMD
          EOF
          chmod 600 ~/.ssh/config

          ssh "$SERVER_HOST" bash -s <<EOF
            set -e
            cd "$DEPLOY_PATH"
            git pull origin main
            export API_IMAGE="$API_IMAGE"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build --remove-orphans
            docker image prune -f
          EOF
