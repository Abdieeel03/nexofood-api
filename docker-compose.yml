services:
  nginx:
    image: nginx:alpine
    container_name: nexofood-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexofood-api
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - .env
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  # Base de datos local (opcional, solo si no se usa Supabase)
  # Para iniciarla junto a la API: docker compose --profile local-db up -d
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nexofood-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nexofood_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - nexofood_postgres_data:/var/lib/postgresql/data
      - ./script.sql:/docker-entrypoint-initdb.d/01-script.sql:ro
      - ./seed_un_usuario_pagos.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    profiles:
      - local-db

volumes:
  nexofood_postgres_data:
