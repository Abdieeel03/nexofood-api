spring:
  application:
    name: nexofood-api
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexofood_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

nexofood:
  crypto:
    master-key: ${CRYPTO_MASTER_KEY}

mercadopago:
  api-base-url: ${MP_API_BASE_URL:https://api.mercadopago.com}
  auth-base-url: ${MP_AUTH_BASE_URL:https://auth.mercadopago.com.pe}
  client-id: ${MP_CLIENT_ID:}
  client-secret: ${MP_CLIENT_SECRET:}
  platform-access-token: ${MP_PLATFORM_ACCESS_TOKEN:}
  test-payer-email: ${MP_TEST_PAYER_EMAIL:}
  webhook-secret: ${MP_WEBHOOK_SECRET:}
  oauth:
    redirect-uri: ${MP_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/mercadopago/oauth/callback}
    state-secret: ${MP_OAUTH_STATE_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    refresh-before-days: ${MP_OAUTH_REFRESH_BEFORE_DAYS:30}
  currency: ${MP_CURRENCY:PEN}
  order-expiration: ${MP_ORDER_EXPIRATION:PT30M}
  reconciliation-cron: ${MP_RECONCILIATION_CRON:0 */5 * * * *}
  token-refresh-cron: ${MP_TOKEN_REFRESH_CRON:0 30 3 * * *}

app:
  frontend:
    base-url: ${FRONTEND_URL:http://localhost:5173}
    order-result-path: ${FRONTEND_ORDER_RESULT_PATH:/store/{slug}/checkout/result}
    subscription-result-path: ${FRONTEND_SUBSCRIPTION_RESULT_PATH:/dashboard/subscription/result}
    mp-connect-result-path: ${FRONTEND_MP_CONNECT_RESULT_PATH:/dashboard/settings/payments}
  jwt:
    secret: ${JWT_SECRET}
    refresh-secret: ${JWT_SECRET_REFRESH}
    expiration-time: ${JWT_EXPIRATION_TIME:900000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
    issuer: ${JWT_ISSUER:nexofood-api}
    audience: ${JWT_AUDIENCE:nexofood-client}
    cleanup-cron: ${JWT_CLEANUP_CRON:0 0 3 * * *}
  security:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      capacity: ${RATE_LIMIT_CAPACITY:10}
      refill-seconds: ${RATE_LIMIT_REFILL_SECONDS:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Requested-With,Accept,Origin}
    exposed-headers: ${CORS_EXPOSED_HEADERS:Authorization}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
    max-age: ${CORS_MAX_AGE:3600}
  tracking:
    average-speed-kmh: ${TRACKING_AVG_SPEED_KMH:25.0}
    road-factor: ${TRACKING_ROAD_FACTOR:1.35}
    pickup-buffer-minutes: ${TRACKING_PICKUP_BUFFER_MINUTES:3}
    dropoff-buffer-minutes: ${TRACKING_DROPOFF_BUFFER_MINUTES:2}
    min-eta-minutes: ${TRACKING_MIN_ETA_MINUTES:2}
    min-ping-interval-seconds: ${TRACKING_MIN_PING_INTERVAL_SECONDS:5}
    poll-interval-seconds: ${TRACKING_POLL_INTERVAL_SECONDS:15}
    stale-after-seconds: ${TRACKING_STALE_AFTER_SECONDS:60}
    max-plausible-speed-kmh: ${TRACKING_MAX_PLAUSIBLE_SPEED_KMH:150.0}
    history-retention-days: ${TRACKING_HISTORY_RETENTION_DAYS:7}
    cleanup-cron: ${TRACKING_CLEANUP_CRON:0 30 3 * * *}
